<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#142a4a">
  <title>Payment Options Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
</head>
<body>
  <div class="print-bar">
    <span>Review the report, then print or save it as a PDF.</span>
    <button onclick="window.print()">🖨 Print / Save as PDF</button>
  </div>

  <div class="page" id="reportRoot">
    <p class="empty-msg hidden" id="emptyMsg">
      No calculator data found. Open the calculator, set up your scenarios, then click “Export Report”.
    </p>
  </div>

  <script src="{{ url_for('static', filename='js/calc.js') }}"></script>
  <script src="{{ url_for('static', filename='js/report.js') }}"></script>
</body>
</html>
