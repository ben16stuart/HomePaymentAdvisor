<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Comparison Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/report.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">

<body>
  <div class="print-bar">
    <span>One card per home, six per page — print or save as a PDF.</span>

  <div id="homesRoot">
    <p class="empty-msg hidden" id="emptyMsg">

    </p>
  </div>

  <script src="{{ url_for('static', filename='js/calc.js') }}"></script>
  <script src="{{ url_for('static', filename='js/homes.js') }}"></script>
